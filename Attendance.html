    <style>
      /* Layout */
      .main-content {
        padding: 40px 20px;
        display: flex;
        justify-content: center;
      }
      .card-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 30px;
        background: #f8f5f5;
        padding: 30px;
        border-radius: 12px;
        width: 100%;
        max-width: 1000px;
      }

      /* Card */
      .card {
        background-color: #62ab90;
        border-radius: 16px;
        min-height: 120px;
        width: 100%;
        display: flex;
        align-items: center;
        padding: 12px;
        gap: 12px;
        overflow: hidden;
        position: relative;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        cursor: pointer;
      }
      .card:active {
        transform: translateY(1px);
      }
      .card:hover {
        transform: translateY(-4px);
      }

      /* Progress circle */
      .progress {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: white;
        margin-left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-shrink: 0;
      }
      .inner-circle {
        width: 56px;
        height: 56px;
        background-color: #62ab90;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: white;
        position: absolute;
        font-size: 13px;
        text-align: center;
        padding: 4px;
      }

      /* Details: hidden by default (shows on hover for desktop) */
      .details {
        color: white;
        font-weight: bold;
        opacity: 0;
        margin-left: 12px;
        transition: opacity 0.25s ease;
        white-space: nowrap;
        font-size: 16px;
      }
      .card:hover .details {
        opacity: 1;
      }

      /* Footer */
      footer {
        text-align: center;
        padding: 12px 8px;
        background-color: rgb(82, 83, 87);
        color: white;
        position: fixed;
        z-index: 100;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 58px;
      }

      @media (max-width: 768px) {
        .card-container {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: 16px;
          padding: 18px;
          max-width: 420px;
          margin: 0 auto;
        }

        .card {
          min-height: 100px;
          padding: 10px;
        }
        .progress {
          width: 70px;
          height: 70px;
        }
        .inner-circle {
          width: 46px;
          height: 46px;
          font-size: 12px;
        }
        .details {
          font-size: 14px;
          opacity: 1;
        }
        .card:hover {
          transform: none;
          box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
        }
      }

      @media (max-width: 420px) {
        .card-container {
          max-width: 360px;
          padding: 12px;
        }
        .progress {
          width: 60px;
          height: 60px;
        }
        .inner-circle {
          width: 40px;
          height: 40px;
          font-size: 11px;
        }
        .details {
          font-size: 13px;
        }
        body {
          padding-bottom: 84px;
        }
      }
    </style>
