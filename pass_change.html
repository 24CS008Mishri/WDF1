<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change Password</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        background: linear-gradient(135deg, #6fe4b9, #8e9de0);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .change-password {
        background-color: #fff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      .change-password h2 {
        margin-bottom: 25px;
        color: #333;
      }

      .change-password input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
      }

      .change-password input[type="submit"] {
        width: 100%;
        padding: 12px;
        background-color: #04aa6d;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .change-password input[type="submit"]:hover {
        background-color: #038d5a;
      }

      .message {
        color: red;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <!-- Change Password Page -->
    <div class="change-password">
      <h2>Change Password</h2>
      <form onsubmit="return validatePassword()">
        <input
          type="password"
          id="oldPassword"
          placeholder="Current Password"
          required
        /><br />
        <input
          type="password"
          id="newPassword"
          placeholder="New Password"
          required
        /><br />
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm New Password"
          required
        /><br />
        <input type="submit" value="Update Password" />
        <p id="errorMsg" class="message"></p>
      </form>
    </div>

    <script>
      function validatePassword() {
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;
        const specialChar = /[!@#$%^&*(),.?":{}|<>]/;
        const errorMsg = document.getElementById("errorMsg");

        if (newPassword.length < 6) {
          errorMsg.textContent = "Password must be at least 6 characters long.";
          return false;
        }

        if (!specialChar.test(newPassword)) {
          errorMsg.textContent =
            "Password must include at least one special character.";
          return false;
        }

        if (newPassword !== confirmPassword) {
          errorMsg.textContent = "Passwords do not match.";
          return false;
        }

        alert("Password changed successfully!");
        return true;
      }
    </script>
  </body>
</html>
