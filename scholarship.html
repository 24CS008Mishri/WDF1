    /* Dropdown */
    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #444;
      min-width: 180px;
      border-radius: 4px;
      z-index:1000;
    }

    .dropdown a {
      padding: 10px 14px;
      font-size: 14px;
      white-space: nowrap;
    }

    .nav-item:hover .dropdown {
      display: block;

    }



    /*Form  */

 .form input,

.form button {

}

.lform button:hover {
